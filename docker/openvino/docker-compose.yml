services:
  kokoro-tts:
      build:
        context: ../..
        dockerfile: docker/openvino/Dockerfile
      devices:
        - /dev/dri
        - /dev/kfd
      group_add:
      # NOTE: These groups are the group ids for: video, input, and render
      # Numbers can be found via running: getent group $GROUP_NAME | cut -d: -f3
        - 44
        - 993
        - 996
      restart: 'always'
      volumes:
        - ./kokoro-tts/config:/root/.config/openvino
        - ./kokoro-tts/cache:/root/.cache/openvino
      ports:
        - 8880:8880
      environment:
        - USE_GPU=true
        - DEVICE=xpu
        # OpenVINO/Intel XPU: volumes above cache config and model cache for faster restarts
