name: kokoro-fastapi-openvino
services:
  kokoro-tts:
    build:
      context: ../..
      dockerfile: docker/openvino/Dockerfile
    devices:
      - /dev/dri
    group_add:
      # NOTE: These groups are the group ids for: video, input, and render
      # Numbers can be found via running: getent group $GROUP_NAME | cut -d: -f3
        - 44
        - 993
        - 996
    # volumes:
    #   - ../../api:/app/api
    ports:
      - "8880:8880"
    environment:
      # ONNX Optimization Settings for vectorized operations
      - ONNX_PROVIDER=OpenVINOExecutionProvider
      # OpenVINO device: CPU (default for compatibility) or GPU / GPU.0
      - OPENVINO_DEVICE_TYPE=GPU
      - ONNX_NUM_THREADS=8  # Maximize core usage for vectorized ops
      - ONNX_INTER_OP_THREADS=4  # Higher inter-op for parallel matrix operations
      - ONNX_EXECUTION_MODE=parallel
      - ONNX_OPTIMIZATION_LEVEL=all
      - ONNX_MEMORY_PATTERN=true
      - ONNX_ARENA_EXTEND_STRATEGY=kNextPowerOfTwo
      - API_LOG_LEVEL=DEBUG
      
